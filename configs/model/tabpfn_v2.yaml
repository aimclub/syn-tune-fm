name: tabpfn_v2
params:
  # v2.5 = weights from Prior-Labs/tabpfn_2_5 (not tabpfn_2_6). License/HF auth may still run once.
  tabpfn_model_version: v2.5
  device: "mps" 
  n_estimators: 1
  fit_mode: 'batched'
  max_data_size: 200
  ft_epochs: 10
  ft_learning_rate: 1e-5
  task_type: "classification"