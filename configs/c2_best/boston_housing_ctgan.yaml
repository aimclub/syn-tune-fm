# Optuna best trial 50, multirun/2026-05-20/12-14-20/0
defaults:
  - override /dataset: boston_housing
  - override /generator: ctgan

generator:
  params:
    epochs: 1000
    batch_size: 100
    generator_lr: 0.001
    discriminator_lr: 0.001
